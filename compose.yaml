services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clearance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: clearance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearance -d clearance"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend]
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      DB_DRIVER: postgres
      DEMO_MODE: "false"
      DATABASE_URL: postgresql://clearance:${POSTGRES_PASSWORD}@db:5432/clearance
      PORT: 4000
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, egress]
networks:
  backend:
    internal: true
  egress: {}
volumes:
  pgdata: {}
