# Copy scripts/compliance-gate.mjs and this step to your product repository.
# Set repository variables and a read-scoped API key secret first.
name: Compliance gate
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check evidence readiness
        run: node scripts/compliance-gate.mjs
        env:
          CLEARANCE_URL: ${{ vars.CLEARANCE_URL }}
          CLEARANCE_PROJECT_ID: ${{ vars.CLEARANCE_PROJECT_ID }}
          CLEARANCE_API_KEY: ${{ secrets.CLEARANCE_API_KEY }}
