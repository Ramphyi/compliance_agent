id: iso-26262
title: ISO 26262:2018 Road vehicles - Functional safety
shortTitle: ISO 26262
version: Second edition 2018-12 (Parts 1 to 12), confirmed by ISO in 2024
authority: ISO (ISO/TC 22/SC 32)
kind: standard
jurisdictions: [global]
url: https://www.iso.org/standard/68388.html
textPolicy: paraphrased
summary: >
  ISO 26262 is the functional safety standard for electrical and electronic systems in series
  production road vehicles. This selection focuses on Part 6 (software development and
  verification, including structural coverage scaled by ASIL), Part 8 (supporting processes such
  as configuration and change management, verification, tool confidence and qualification of
  software components), Part 9 (ASIL decomposition and dependent failure analysis) and the Part 2
  and Part 4 essentials (safety plan, safety case, functional safety assessment, safety
  mechanisms).
applicability:
  any:
    - all:
        - { fact: productTypes, in: [automotive-ecu] }
        - { fact: asil, in: [A, B, C, D] }
    - all:
        - { fact: sector, in: [automotive] }
        - { fact: safetyCritical, in: [injury-possible, life-critical] }
applicabilityNote: >
  Not a law, but OEMs require it contractually for safety-related E/E systems, and it is the
  reference for the state of the art in product liability. Requirements and the strength of
  recommended methods scale with the ASIL of the requirements allocated to the software; QM-only
  software is outside its scope (apart from freedom from interference with ASIL software).
  Suppliers developing a Safety Element out of Context (SEooC) must document their assumptions of
  use. A third edition is being drafted, with publication not expected before 2027; audit against
  the 2018 edition unless the customer contract names another. ISO/PAS 8800:2024 adds guidance for
  AI and ML elements, and ISO 21448 covers functional insufficiencies (SOTIF).
controls:
  - ref: "2-6.4.6"
    title: Safety plan and coordination of safety activities
    requirement: >
      The safety activities of the project, including tailoring with rationale, responsibilities,
      schedule, supporting processes and the work products to produce, are planned in a safety
      plan that is kept up to date and coordinated with the overall project plan.
    category: governance
    severity: high
    fixability: document
    guidance: >
      Look for docs/safety/safety-plan or the safety section of the project plan. Check that it
      names the ASIL, the Part 6 activities and their methods (coding guideline such as MISRA C
      or MISRA C++, static analysis tool, unit test framework, coverage tool and target coverage
      per ASIL, integration and HIL test environment), tool classification, the configuration
      and change management process, and the confirmation measures. Compare the plan with the
      repository: a plan that promises MC/DC or Polyspace while CI only runs gcov line coverage
      and cppcheck is a gap. For an SEooC, check that assumptions of use are listed.
    evidence:
      - Safety plan with activities, owners, methods per ASIL and tailoring rationale
      - Consistency between planned methods and configured CI jobs
    artifacts: [ci-pipeline]
    crosswalk: ["iec-61508:7.1", "automotive-spice:MAN.3", "iso-sae-21434:6.4.2"]
  - ref: "2-6.4.8"
    title: Safety case
    requirement: >
      For items with safety goals of ASIL A to D, a safety case is developed according to the
      safety plan and compiled progressively, presenting the argument that functional safety is
      achieved, supported by evidence from the work products.
    category: functional-safety
    severity: high
    fixability: document
    guidance: >
      Look for a safety case document or model (GSN in Astah, ASCE, Socrates or as Markdown with
      claim and evidence IDs), or a supplier safety manual and safety case for an SEooC. Check
      that each claim references existing evidence in the repository or archive (requirements
      export, architecture, static analysis report, unit and integration test reports, coverage
      report, tool classification, review records) for the released software version, and that
      open issues and deviations are visible rather than hidden. Good looks like evidence
      generated by CI and referenced by stable IDs and baselines.
    evidence:
      - Safety case with claims, arguments and evidence references
      - Evidence artefacts that match the released baseline
    artifacts: [safety-case]
    crosswalk: ["iso-sae-21434:6.4.7", "iso-21448:12"]
  - ref: "2-6.4.12"
    title: Confirmation measures and functional safety assessment
    requirement: >
      Confirmation reviews, functional safety audits and the functional safety assessment are
      performed with a level of independence that increases with the ASIL, to judge whether the
      item achieves functional safety (6.4.9 to 6.4.12).
    category: governance
    severity: medium
    fixability: process
    guidance: >
      Look for confirmation review records (safety plan, safety analyses, safety case), audit
      reports and the functional safety assessment report with the assessor's independence
      stated, and for tracking of findings to closure (issues labelled as FSA or confirmation
      findings). For suppliers, check that the OEM's assessment needs (work products, access for
      audits) are planned in the development interface agreement.
    evidence:
      - Confirmation review and audit records with independence documented
      - Functional safety assessment report and closed findings
    crosswalk: ["iec-61508:8", "automotive-spice:SUP.1"]
  - ref: "4-6.4.2"
    title: Safety mechanisms, safe states and fault tolerant time
    requirement: >
      The technical safety concept specifies safety mechanisms to detect, indicate and control
      faults, including the transition to and maintenance of safe states, fault tolerant and fault
      handling time intervals, emergency operation and warnings or degradation.
    category: functional-safety
    severity: high
    fixability: code
    guidance: >
      Map each safety mechanism allocated to software to code: Dem events and debouncing, FiM
      function inhibition, safe-state handlers (torque or actuator shut-off, valve de-energise,
      limp-home), timing constants for detection and reaction that fit the fault tolerant time
      interval, and requirement IDs in comments (for example /* TSR_0123 */). Check that the safe
      state remains reachable when the application hangs (independent or windowed hardware
      watchdog, SBC fail-safe output, separate shutdown path), and that degradation and warnings
      are signalled to other ECUs or the driver.
    evidence:
      - Mapping of technical safety requirements and mechanisms to software units
      - Timing analysis showing detection plus reaction within the fault tolerant time interval
    checks: [missing-watchdog]
    artifacts: [architecture-doc, requirements-traceability]
    crosswalk: ["iec-61508:7.4.3", "iso-21448:8"]
  - ref: "6-5.4.3"
    title: Modelling and coding guidelines
    requirement: >
      Where the chosen modelling or programming language does not itself ensure the needed
      properties, guidelines or the development environment must cover topics such as low
      complexity, language subsets, strong typing, defensive implementation, established design
      principles, unambiguous graphical representation, style guides, naming conventions and
      concurrency.
    category: code-safety
    severity: high
    fixability: code
    guidance: >
      Look for a coding standard (MISRA C:2012 with amendments or MISRA C:2023, MISRA C++:2023,
      AUTOSAR C++14 for legacy C++, plus project naming and style rules) and its enforcement in
      CI: Polyspace, Helix QAC, Coverity, PC-lint Plus, Klocwork, Parasoft, or cppcheck with the
      MISRA addon; clang-tidy profiles; compiler warnings (-Wall -Wextra -Wconversion -Wshadow
      -Werror, or the vendor equivalents for TASKING, GHS, HighTec, IAR, Diab). Check complexity
      limits (HIS metrics such as cyclomatic complexity and nesting, measured with Lizard,
      pmccabe or the analyzer), fixed-width types from Std_Types.h or stdint.h at interfaces,
      concurrency rules (SchM exclusive areas, OS resources, spinlocks on multicore), and a
      deviation process. For model-based code (Simulink, TargetLink) look for modelling
      guidelines (MAAB or JMAAB, MISRA AC) and model checks.
    evidence:
      - Coding and modelling guidelines covering the listed topics
      - Static analysis configuration enforced in CI with a deviation record
    checks: [unsafe-c-functions, goto-statement, dynamic-memory-embedded]
    artifacts: [coding-standard, static-analysis-config]
    crosswalk: ["misra-cpp:Deviations", "misra-c:GRP", "misra-c:Rule 1.3", "iec-61508:Table B.1", "iec-61508:Table A.3", "automotive-spice:SWE.3"]
  - ref: "6-6"
    title: Software safety requirements
    requirement: >
      Software safety requirements are derived from the technical safety requirements and the
      system architecture, covering safety-related functions and properties such as timing,
      fault detection and reaction, safe states, degradation and the hardware-software interface,
      and are verified for consistency and completeness.
    category: functional-safety
    severity: high
    fixability: document
    guidance: >
      Look for a requirements export (ReqIF, DOORS or Polarion CSV, codebeamer, sphinx-needs RST)
      with IDs, ASIL attribute, status and parent links. Check that timing, fault reaction and
      HSI-related requirements exist, not only functional ones, and that code and tests reference
      requirement IDs (comment tags such as @req or Doxygen \satisfies, test names or
      annotations). Flag safety-relevant modules with no requirement references.
    evidence:
      - Software safety requirements with ASIL and parent traceability
      - Verification records of the requirements
    artifacts: [requirements-traceability]
    crosswalk: ["automotive-spice:SWE.1", "iec-61508:7.2"]
  - ref: "6-7"
    title: Software architectural design
    requirement: >
      The software architecture describes static and dynamic aspects down to software units,
      follows principles such as hierarchy, limited size, complexity and interface size, strong
      cohesion, loose coupling, appropriate scheduling, restricted interrupts and controlled shared
      resources, allocates safety requirements, includes error detection and error handling
      mechanisms, estimates resource needs, and is analysed for safety and dependent failures.
    category: functional-safety
    severity: high
    fixability: document
    guidance: >
      Inspect ARXML (SWC types, ports and runnables, RTE events, Os.arxml tasks, priorities and
      periods), architecture documents and diagrams, and the directory structure. Check that
      safety-relevant components carry their ASIL, that application code reaches hardware only
      through RTE, IoHwAb and MCAL layers, that interrupt usage is limited and documented
      (category 1 and 2 ISRs, priorities), and that shared data is protected (SchM exclusive
      areas, OS resources, spinlocks). Look for error detection mechanisms (range checks of
      inputs and outputs, plausibility against redundant or model-based values, E2E checks,
      alive counters, control flow monitoring) and error handling (Dem reporting, FiM inhibition,
      degraded modes, safe state). Resource estimates should exist: linker map and memory budget,
      stack analysis (GCC -fstack-usage, StackAnalyzer), worst-case execution time or CPU load
      measurements.
    evidence:
      - Architecture description with static and dynamic views and ASIL allocation
      - Error detection and handling mechanisms traced to safety requirements
      - Memory, stack and timing budgets with measurements
    checks: [missing-watchdog]
    artifacts: [architecture-doc]
    crosswalk: ["automotive-spice:SWE.2", "iec-61508:7.4.3"]
  - ref: "6-8"
    title: Software unit design and implementation principles
    requirement: >
      Software units are specified and implemented with design principles such as one entry and
      one exit, no dynamic objects or variables (or online checks when used), initialised
      variables, no reuse of names, avoided or justified global variables, restricted pointers, no
      implicit type conversions, no hidden data or control flow, no unconditional jumps and no
      recursion, so that the code is correct, robust and verifiable.
    category: code-safety
    severity: high
    fixability: code
    guidance: >
      Inspect C and C++ sources of safety-relevant units: malloc, calloc, realloc, free, new and
      delete after initialisation; goto; recursion (call-graph cycles from the static analyzer,
      cflow or clang); multiple returns where the guideline forbids them; uninitialised locals;
      extern non-const globals instead of file-static data with accessors; pointer arithmetic and
      casts between pointer types; implicit narrowing or signed and unsigned mixing
      (-Wconversion, -Wsign-conversion); function pointers and setjmp or longjmp as hidden control
      flow; variables shared with ISRs that are not volatile or not protected. Defensive
      implementation is expected: parameter range checks with Det_ReportError or an error return,
      default branches in switch statements, checks of return values (Std_ReturnType E_OK or
      E_NOT_OK), and plausibility checks on received data.
    evidence:
      - Static analysis results with no open violations of the unit design rules or justified deviations
      - Unit design specifications for safety-relevant units
    checks: [dynamic-memory-embedded, goto-statement, unsafe-c-functions]
    artifacts: [coding-standard, static-analysis-config]
    crosswalk: ["misra-c:Rule 21.3", "misra-c:Rule 15.1", "misra-c:Rule 17.2", "misra-cpp:Rule 21.6.1", "misra-cpp:Rule 8.2.10", "iec-61508:Table A.4", "automotive-spice:SWE.3"]
  - ref: "6-9"
    title: Software unit verification
    requirement: >
      Software units are verified with methods selected by ASIL, such as walk-throughs,
      inspections, static code analysis and abstract interpretation, control and data flow
      analysis, requirements-based tests, interface tests, fault injection, resource usage
      evaluation and back-to-back tests for generated code, with test cases derived from
      requirements, equivalence classes, boundary values and error guessing.
    category: testing-verification
    severity: high
    fixability: code
    guidance: >
      Look for unit tests per safety-relevant unit (Unity or Ceedling, CppUTest, GoogleTest,
      VectorCAST, Tessy, Cantata, LDRA TBrun) with requirement IDs in test names or attributes,
      boundary and invalid-input tests, fault injection through stubs (Rte_Read returning
      E_NOT_OK, corrupted E2E counters, NvM read errors), static analysis reports (Polyspace Code
      Prover results with red and orange checks justified), and code review records with
      checklists. For higher ASILs, check that tests run on target or an instruction set
      simulator with the production compiler, or that the difference is justified.
    evidence:
      - Unit test specifications and results traced to requirements
      - Static analysis and review records per unit
    artifacts: [automated-tests, static-analysis-config, code-review-process]
    crosswalk: ["automotive-spice:SWE.4", "iec-61508:7.4.7", "iec-61508:Table B.8"]
  - ref: "6-9.4.4"
    title: Structural coverage at unit level
    requirement: >
      Requirements coverage and structural coverage of unit testing are measured; statement
      coverage is highly recommended for ASIL A and B, branch coverage for ASIL B to D, and MC/DC
      for ASIL D, and any code not covered is analysed and justified or covered by other means.
    category: testing-verification
    severity: high
    fixability: code
    when:
      { fact: asil, in: [A, B, C, D] }
    guidance: >
      Look for coverage configuration and gates: gcov or llvm-cov with lcov or gcovr
      (--coverage, branch coverage enabled, gcovr --fail-under-line and --fail-under-branch),
      Bullseye, Testwell CTC++, VectorCAST, Tessy, LDRA or Cantata project settings, and
      archived coverage reports per release. Check that the metric matches the ASIL (branch
      coverage for ASIL B and above), that exclusions (LCOV_EXCL_LINE, pragma-based exclusions)
      carry a justification, and that uncovered defensive or deactivated code is analysed rather
      than ignored. Coverage measured on host should be argued representative of the target build.
    evidence:
      - Coverage tool configuration with ASIL-appropriate metric and threshold
      - Coverage reports per release with justification of uncovered code
    artifacts: [test-coverage-config, automated-tests, ci-pipeline]
    crosswalk: ["automotive-spice:SWE.4", "iec-61508:7.4.7", "iec-62304:5.5.5"]
  - ref: "6-9.4.4-1c"
    title: MC/DC coverage for ASIL D units
    requirement: >
      For ASIL D software units, modified condition and decision coverage is highly recommended:
      tests must show that each condition in a decision independently affects the outcome.
    category: testing-verification
    severity: high
    fixability: code
    when:
      { fact: asil, equals: D }
    guidance: >
      Check that the coverage tool measures true MC/DC (VectorCAST, LDRA, Tessy, Cantata,
      Testwell CTC++, Clang 18 or later with -fcoverage-mcdc, GCC 14 or later with
      -fcondition-coverage and gcov --conditions) rather than only condition or decision
      coverage, and that the CI gate enforces it for ASIL D units. Decisions with many conditions
      should be simplified or justified. If MC/DC is not reached, look for a documented rationale
      and compensating measures accepted in the safety case.
    evidence:
      - MC/DC results for every ASIL D unit
      - Rationale for any decision not achieving MC/DC
    artifacts: [test-coverage-config]
    crosswalk: ["iec-61508:7.4.7"]
  - ref: "6-10"
    title: Software integration and verification
    requirement: >
      Software is integrated according to the architecture and verified for correct interfaces,
      functional dependencies, resource usage, timing, effectiveness of safety mechanisms and
      freedom from interference, using requirement-based, interface, fault injection and
      resource usage tests, with function and call coverage measured at architectural level.
    category: testing-verification
    severity: high
    fixability: code
    guidance: >
      Look for software-in-the-loop integration tests (virtual ECU with RTE, Vector vVIRTUALtarget,
      Synopsys Silver, QEMU), CANoe test modules and CAPL scripts, ECU-TEST or pytest suites with
      python-can or udsoncan, fault injection (E2E failures, CAN timeouts, sensor out-of-range,
      task overruns), CPU load and timing measurements (OS hooks, trace with Lauterbach or
      Gliwa T1), stack and memory usage reports, and function and call coverage from the
      integration test run.
    evidence:
      - Integration test specification and results traced to architecture and requirements
      - Resource usage and timing verification results
      - Function and call coverage at architectural level
    artifacts: [automated-tests, test-coverage-config, ci-pipeline]
    crosswalk: ["automotive-spice:SWE.5", "iec-61508:7.4.8"]
  - ref: "6-11"
    title: Testing of the embedded software in the target environment
    requirement: >
      The embedded software is tested in its target environment (hardware-in-the-loop, ECU
      network or vehicle) to show it fulfils the software safety requirements, using
      requirements-based tests and fault injection.
    category: testing-verification
    severity: high
    fixability: code
    guidance: >
      Look for HIL test specifications and results (dSPACE, NI, Vector VT System; ECU-TEST,
      AutomationDesk or pytest projects), tests traced to software safety requirements, fault
      injection on the real hardware (debugger scripts, CAN fault injection, supply voltage
      variation), and evidence that the tested binary is the release binary (hash or version in
      the report).
    evidence:
      - HIL or target test reports for the release binary traced to safety requirements
    artifacts: [automated-tests, requirements-traceability]
    crosswalk: ["automotive-spice:SWE.6", "iec-61508:7.7"]
  - ref: "6-C"
    title: Configuration and calibration data
    requirement: >
      For configurable software, configuration and calibration data are specified, the configured
      software is verified for the intended configurations, and safety mechanisms protect against
      incorrect or corrupted data (Annex C).
    category: functional-safety
    severity: medium
    fixability: code
    guidance: >
      Check AUTOSAR configuration (ARXML, generated *_Cfg.c and *_PBcfg.c with generator version
      recorded), calibration data (A2L, calibration sections in the linker script, XCP or CCP),
      and variant coding (UDS WriteDataByIdentifier 0x2E DIDs, NvM blocks). Expect NvM blocks for
      safety data with CRC (NvMBlockUseCrc) and redundancy where needed, checksum verification of
      calibration areas at start-up, range and plausibility checks on calibration values, write
      access to coding and calibration protected by SecurityAccess or Authentication, and
      calibration interfaces disabled or locked in production builds.
    evidence:
      - Specification of configuration and calibration data with valid ranges
      - Integrity checks and verification of the released configurations
    checks: [uds-weak-security-access, debug-enabled]
    crosswalk: ["unece-r155:Annex5.B.M7"]
  - ref: "6-D"
    title: Freedom from interference between software elements
    requirement: >
      Where software of different ASILs, or QM and ASIL software, coexist, freedom from
      interference is shown for timing and execution, memory, and exchange of information, or all
      software is developed to the highest ASIL (Annex D and Part 9 clause 6).
    category: functional-safety
    severity: high
    fixability: code
    guidance: >
      Timing and execution: AUTOSAR WdgM with alive, deadline and logical (program flow)
      supervision of safety runnables, an external or windowed watchdog (SBC such as TLF35584
      or FS65), OS timing protection (execution budgets, inter-arrival limits). Memory: MPU or
      MMU partitioning with OS-Applications (trusted and non-trusted), separate linker sections per
      ASIL partition, no QM code writing ASIL data, stack protection. Exchange of information:
      AUTOSAR E2E protection (profiles such as P01, P02, P04, P05, P07, P11, P22, or the E2E
      transformer) with CRC, alive counter, data ID and timeout, and handling of every E2E status
      (substitute value, Dem event, degradation). Flag safety software that reads bus signals
      without E2E checks and main loops without watchdog servicing tied to program flow.
    evidence:
      - Freedom-from-interference analysis with timing, memory and communication measures
      - WdgM, MPU and E2E configuration and tests showing detection
    checks: [missing-watchdog]
    artifacts: [architecture-doc]
    crosswalk: ["iso-26262:9-7", "misra-c:Dir 5.1"]
  - ref: "8-5"
    title: Development interface agreement in distributed development
    requirement: >
      In distributed developments, suppliers are selected on safety capability, a development
      interface agreement allocates safety activities, work products and responsibilities,
      safety information is exchanged, and supplier work is included in the functional safety
      assessment.
    category: supply-chain
    severity: medium
    fixability: document
    guidance: >
      Look for a DIA or RASIC, the safety manuals of supplied SEooC elements (MCAL, AUTOSAR BSW
      and OS, safety libraries, RTOS) and a list of their assumptions of use. Check in code that
      those assumptions are honoured, for example required start-up RAM and flash tests, MCAL
      register monitoring calls, mandatory configuration parameters, and use of the qualified
      library versions.
    evidence:
      - Development interface agreement and supplier safety manuals
      - Evidence that assumptions of use are fulfilled
    artifacts: [third-party-notices]
    crosswalk: ["iso-sae-21434:7.4.3", "automotive-spice:ACQ.4"]
  - ref: "8-6"
    title: Management of safety requirements and traceability
    requirement: >
      Safety requirements are uniquely identified, unambiguous, atomic, verifiable and consistent,
      carry status and ASIL, and are managed with bidirectional traceability to upstream
      requirements, design and verification.
    category: transparency-documentation
    severity: medium
    fixability: document
    guidance: >
      Check the requirements export for unique IDs, ASIL and status attributes, and trace
      matrices from technical safety requirements to software safety requirements, architecture,
      code and tests. A CI script that fails on orphan requirements, untested requirements or
      tests without requirements is good practice.
    evidence:
      - Traceability matrix covering requirements, design, code and tests
    artifacts: [requirements-traceability]
    crosswalk: ["automotive-spice:Traceability"]
  - ref: "8-7"
    title: Configuration management and documentation
    requirement: >
      Work products, including source code, configuration, generated code, tools and build
      environment, are uniquely identified, baselined and reproducible, and documentation is
      managed with identification, versions and status (8-10).
    category: secure-development
    severity: medium
    fixability: process
    guidance: >
      Check for release tags, protected branches, pinned submodules, recorded generator versions
      for AUTOSAR configuration and model-generated code, a pinned toolchain (Docker image or
      toolchain installer with exact compiler version and options), and a release manifest with
      hashes of .elf, .hex or .s19 and A2L files. Documents should live under version control with
      IDs and status.
    evidence:
      - Baselines that reproduce the released binary
      - Release manifest with artefact hashes and tool versions
    checks: [unpinned-dependencies]
    artifacts: [ci-pipeline, dependency-lockfile, changelog]
    crosswalk: ["automotive-spice:SUP.8", "unece-r156:7.1.1", "iec-61508:6.2.3"]
  - ref: "8-8"
    title: Change management with safety impact analysis
    requirement: >
      Changes to safety-related work products are requested, analysed for impact on safety,
      evaluated, decided, implemented and verified, with records kept.
    category: governance
    severity: medium
    fixability: process
    guidance: >
      Look for merge or pull request templates with a safety impact field, links to change
      requests, CODEOWNERS that require a safety engineer for ASIL directories, and regression
      and coverage re-runs for affected units. Check a sample of merged changes to safety code for
      impact analysis and verification evidence.
    evidence:
      - Change requests with impact analysis and verification records
    artifacts: [code-review-process, changelog]
    crosswalk: ["automotive-spice:SUP.10", "iec-61508:7.8"]
  - ref: "8-9"
    title: Verification planning, execution and evaluation
    requirement: >
      Verification of each work product is planned, specified with pass and fail criteria,
      executed and evaluated, and the results are recorded and reviewed.
    category: testing-verification
    severity: medium
    fixability: process
    guidance: >
      Look for review records for requirements, architecture and code (approved merge requests
      with checklists), test specifications with expected results, and verification reports per
      baseline generated from CI. Check that failed or skipped tests in the release run are
      explained.
    evidence:
      - Verification plan, review records and test reports per baseline
    artifacts: [code-review-process, automated-tests, ci-pipeline]
    crosswalk: ["automotive-spice:SWE.6", "iec-61508:7.4.6"]
  - ref: "8-11"
    title: Confidence in the use of software tools
    requirement: >
      Software tools are classified by tool impact and tool error detection into a tool
      confidence level; tools at TCL2 or TCL3 are qualified by methods chosen by ASIL (increased
      confidence from use, evaluation of the development process, validation, or development to a
      safety standard), and their versions and usage constraints are recorded.
    category: secure-development
    severity: high
    fixability: document
    guidance: >
      List the tools used by the repository: compiler and linker, code generators (Embedded
      Coder, TargetLink, AUTOSAR configurators such as DaVinci or EB tresos), static analyzers,
      coverage and unit test tools, and in-house scripts that generate code or tables. Look for a
      tool classification and qualification report, use of qualified compilers or qualification
      kits, and check that the versions and options in the build files match the qualified ones
      (for example the optimisation level and target options in the qualification scope).
    evidence:
      - Tool classification with TI, TD and TCL per tool
      - Qualification evidence for TCL2 and TCL3 tools with matching versions
    artifacts: [ci-pipeline]
    crosswalk: ["iec-61508:7.4.4", "iso-sae-21434:5.4.5"]
  - ref: "8-12"
    title: Qualification of software components
    requirement: >
      Reused or third-party software components intended for safety use (libraries, RTOS, basic
      software) are qualified with specified requirements, behaviour in failure and overload
      conditions, and verification evidence, valid only for the specified usage and version.
    category: supply-chain
    severity: medium
    fixability: document
    guidance: >
      Identify third-party and legacy code in safety paths (vendor/, third_party/, BSW, MCAL,
      FreeRTOS or SAFERTOS, CRC or math libraries, compiler runtime libraries). Check for
      qualification reports or safety certificates for the exact versions used, and that
      unqualified components in ASIL paths are either qualified, developed per the standard, or
      isolated with freedom from interference.
    evidence:
      - Qualification reports or certificates for each reused safety component and version
    artifacts: [sbom, third-party-notices]
    crosswalk: ["iso-sae-21434:6.4.6"]
  - ref: "9-5"
    title: ASIL decomposition with sufficient independence
    requirement: >
      When a safety requirement is decomposed into redundant requirements with lower ASILs, the
      elements implementing them are sufficiently independent, the decomposition is recorded
      with the original ASIL, and integration and confirmation follow the original ASIL.
    category: functional-safety
    severity: high
    fixability: code
    guidance: >
      Look for requirements noted as ASIL B(D), A(B) and similar, and in code for redundant
      channels such as a function and monitor structure (for example a three-level monitoring
      concept with function, function monitoring and controller monitoring). Check that the
      monitor does not share code, data acquisition, calibration or memory with the main channel
      without justification, that the channels run in separate partitions or cores where needed,
      and that common libraries are developed to the original ASIL.
    evidence:
      - Decomposition records with independence argument
      - Code structure showing separated channels
    artifacts: [architecture-doc, safety-case]
    crosswalk: ["iso-26262:6-D"]
  - ref: "9-7"
    title: Analysis of dependent failures
    requirement: >
      Dependent failures, both common cause and cascading, that could defeat independence or
      freedom from interference are identified and evaluated, and measures are defined.
    category: risk-assessment
    severity: medium
    fixability: document
    guidance: >
      Look for a dependent failure analysis covering shared resources in software: the same RTOS
      and scheduler, shared libraries, shared NvM blocks, shared clocks and power, the same
      compiler, and shared input data. Check that the measures it names (diverse algorithms,
      separate tasks with timing protection, memory partitioning, data checks) exist in the code.
    evidence:
      - Dependent failure analysis with measures traced to implementation
    artifacts: [architecture-doc]
    crosswalk: ["iso-26262:6-D"]
