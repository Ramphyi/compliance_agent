id: iso-iec-27001
title: Information security, cybersecurity and privacy protection - Information security management systems - Requirements
shortTitle: ISO/IEC 27001
version: ISO/IEC 27001:2022 including Amd 1:2024
authority: ISO/IEC JTC 1/SC 27
kind: standard
jurisdictions: [global]
url: https://www.iso.org/standard/27001
textPolicy: paraphrased
summary: >
  ISO/IEC 27001 specifies requirements for an information security management system
  (ISMS): scoping, risk assessment and treatment, a statement of applicability, internal
  audit, management review and continual improvement (clauses 4 to 10), with Annex A
  listing 93 reference controls in four themes (organisational, people, physical and
  technological). It is the most widely recognised security certification worldwide.
applicability:
  any:
    - { fact: certificationsTarget, in: [iso-27001] }
    - { fact: regulatedEntity, in: [nis2-essential, nis2-important, dora-financial-entity, ict-provider-to-finance] }
    - all:
        - { fact: audience, in: [businesses, public-sector, healthcare-providers] }
        - { fact: productTypes, in: [saas, web-app, backend-api] }
        - { fact: dataCategories, in: [personal, health, genetic-biometric, payment-cards, financial, children, location, credentials, other-sensitive] }
applicabilityNote: >
  Voluntary, but included when the organisation targets ISO/IEC 27001 certification, when
  it is (or serves) a NIS2 or DORA entity, because ISO 27001 is the usual way to evidence
  the risk management measures those laws require and suppliers are asked for it, and
  when a hosted or web product processes personal or sensitive data for business or public
  customers, who routinely require ISO 27001 or SOC 2 in procurement. This file emphasises
  Annex A technological controls (A.8) whose implementation can be seen in code, CI and
  infrastructure, plus key organisational controls; clauses 4 to 10 are summarised. Text is
  paraphrased with clause and control numbers kept; consult the licensed standard and
  ISO/IEC 27002:2022 for implementation guidance. Amd 1:2024 added climate-change
  considerations to clauses 4.1 and 4.2. Certificates against the 2013 edition expired at
  the end of the transition period on 31 October 2025.
keyDates:
  - { date: "2024-02-23", note: "Amendment 1:2024 (climate action changes) published" }
  - { date: "2025-10-31", note: "End of transition from ISO/IEC 27001:2013 certificates to the 2022 edition" }
controls:
  - ref: "4.3"
    title: ISMS scope
    requirement: >
      The organisation determines and documents the boundaries of the ISMS, considering
      internal and external issues, interested parties and interfaces with activities
      performed by others.
    category: governance
    severity: medium
    fixability: document
    guidance: >
      Look for a scope statement that names the products, services, environments,
      locations and teams covered. Check that the repository's production systems (cloud
      accounts in infrastructure as code, deployed services, third-party SaaS used for
      operations) fall within it.
    evidence:
      - Documented ISMS scope covering the product and its infrastructure
    artifacts: [security-policy, architecture-doc]
    crosswalk: ["iso-iec-42001:4.3", "soc2:CC3.2"]

  - ref: "6.1.2"
    title: Risk assessment, treatment and statement of applicability
    requirement: >
      The organisation runs a repeatable information security risk assessment, selects
      treatments and the Annex A or other controls needed, and documents a statement of
      applicability with justification for inclusions and exclusions (6.1.3), repeating the
      assessment at planned intervals and after significant change (clause 8).
    category: risk-assessment
    severity: high
    fixability: document
    guidance: >
      Look for a risk register with assets, threats, likelihood, impact, owners and
      treatment, a statement of applicability, and threat models for the product. Check that
      major technical risks visible in the code (internet exposure, multi-tenancy, payment or
      health data, third-party integrations) appear in the register.
    evidence:
      - Risk register, risk treatment plan and statement of applicability
      - Threat model for the product
    artifacts: [risk-management-file, threat-model]
    crosswalk: ["soc2:CC3.2", "nis2:Art.21(2)(a)", "iso-iec-42001:6.1.2"]

  - ref: "9.2"
    title: Internal audit and management review
    requirement: >
      The organisation conducts internal audits of the ISMS at planned intervals, holds
      management reviews (9.3), monitors and measures security performance (9.1) and
      corrects nonconformities (10.2).
    category: governance
    severity: medium
    fixability: process
    guidance: >
      Organisational. Repository evidence can include an audit programme, control
      monitoring dashboards or compliance-as-code reports, and a tracked corrective action
      log (issues labelled for ISMS nonconformities with root cause and closure).
    evidence:
      - Internal audit reports and management review records
      - Corrective action log
    crosswalk: ["soc2:CC4.1", "iso-iec-42001:9"]

  - ref: A.5.7
    title: Threat intelligence
    requirement: >
      Information about threats relevant to the organisation is collected and analysed to
      produce threat intelligence that informs protective measures.
    category: vulnerability-management
    severity: low
    fixability: process
    guidance: >
      Look for subscriptions to security advisories for the technology stack (GitHub
      security advisories and Dependabot alerts, OSV, vendor bulletins, CISA KEV), a process
      that turns them into tickets, and threat model updates that reference current attack
      techniques.
    evidence:
      - Advisory feeds wired into issue tracking
      - Threat model updates referencing current threats
    artifacts: [vulnerability-scanning, threat-model]
    crosswalk: ["nis2:Art.21(2)(e)"]

  - ref: A.5.23
    title: Information security for cloud services
    requirement: >
      Processes for acquiring, using, managing and exiting cloud services are established
      according to the organisation's security requirements.
    category: supply-chain
    severity: medium
    fixability: process
    guidance: >
      Look for an inventory of cloud and SaaS providers used by the product (from
      infrastructure as code, SDKs and environment variables), supplier security reviews
      and DPAs, the shared-responsibility split, and hardening baselines applied in code
      (Terraform modules with encryption, logging and public access blocks; tfsec, checkov
      or Prowler scans in CI). Check for an exit or data export plan for critical providers.
    evidence:
      - Cloud service inventory with security reviews and agreements
      - Infrastructure as code scanned against a hardening baseline
    artifacts: [static-analysis-config, processing-records]
    crosswalk: ["soc2:CC9.2", "dora:Art.28", "iso-iec-42001:A.10.3"]

  - ref: A.5.24
    title: Incident management planning, response and learning
    requirement: >
      The organisation plans and prepares incident management with defined processes,
      roles and responsibilities, assesses and classifies security events (A.5.25),
      responds to incidents according to documented procedures (A.5.26), learns from them
      (A.5.27) and collects and preserves evidence (A.5.28).
    category: logging-monitoring
    severity: high
    fixability: document
    guidance: >
      Look for an incident response plan (SECURITY.md process, docs/incident-response.md,
      runbooks) with severity classification, on-call ownership, communication and
      regulatory notification steps (GDPR 72 hours, NIS2 24-hour early warning where
      applicable), post-incident review templates, and evidence preservation (log
      retention, immutable storage, snapshots). Check that alerting routes to an on-call
      tool and that past post-mortems exist.
    evidence:
      - Incident response plan with classification, roles and notification duties
      - Post-incident review records and evidence retention settings
    artifacts: [incident-response-plan, security-policy]
    crosswalk: ["soc2:CC7.4", "nis2:Art.23", "gdpr:Art.33", "dora:Art.17"]

  - ref: A.5.34
    title: Privacy and protection of PII
    requirement: >
      The organisation identifies and meets requirements for preserving privacy and
      protecting personally identifiable information under applicable law, regulation and
      contracts.
    category: data-protection
    severity: high
    fixability: document
    when:
      { not: { fact: dataCategories, in: [none] } }
    guidance: >
      Look for records of processing, a privacy policy, data classification, DPIAs where
      required, and technical measures in code: field-level encryption of sensitive
      attributes, retention jobs, deletion and export endpoints, and redaction in logs.
      ISO/IEC 27701 can extend the ISMS into a privacy information management system.
    evidence:
      - Records of processing and privacy notices
      - Implemented retention, deletion and access mechanisms for PII
    checks: [pii-in-logs]
    artifacts: [processing-records, privacy-policy, dpia]
    crosswalk: ["gdpr:Art.32", "soc2:C1.1"]

  - ref: A.8.2
    title: Privileged access rights
    requirement: >
      The allocation and use of privileged access rights are restricted and managed.
    category: authentication-access
    severity: high
    fixability: code
    guidance: >
      Check IAM in infrastructure as code for wildcard permissions (Action "*", Resource
      "*", roles/owner, Contributor at subscription scope), long-lived admin access keys,
      shared root or break-glass accounts without MFA, and CI tokens with admin scope. In
      the application, check admin roles are few, separately authenticated with MFA,
      time-limited where possible, and audited.
    evidence:
      - Least-privilege IAM policies without wildcards
      - MFA and logging for privileged accounts
    crosswalk: ["soc2:CC6.3", "owasp-asvs:V8.2.1", "nis2:Art.21(2)(i)"]

  - ref: A.8.3
    title: Information access restriction
    requirement: >
      Access to information and application functions is restricted according to the
      access control policy.
    category: authentication-access
    severity: high
    fixability: code
    guidance: >
      Check application authorisation (deny by default, role and object-level checks,
      tenant isolation) and data store access (no public buckets, database users scoped
      per service, row-level security where multi-tenant). Flag storage resources with
      public ACLs or policies in infrastructure as code and endpoints that return data
      without ownership checks.
    evidence:
      - Deny-by-default authorisation with object-level checks
      - Private data stores with per-service credentials
    crosswalk: ["owasp-asvs:V8.2.2", "owasp-asvs:V8.4.1", "soc2:CC6.1"]

  - ref: A.8.4
    title: Access to source code
    requirement: >
      Read and write access to source code, development tools and software libraries is
      appropriately managed.
    category: secure-development
    severity: medium
    fixability: process
    guidance: >
      Check for branch protection on the default branch (required reviews, status checks,
      no force pushes), CODEOWNERS for sensitive paths, signed commits or tags where
      required, and least-privilege repository permissions. Check that secrets are not in
      the repository and that CI cannot push to protected branches without review.
    evidence:
      - Branch protection and mandatory review configuration
      - CODEOWNERS for security-sensitive code
    checks: [hardcoded-secret]
    artifacts: [code-review-process]
    crosswalk: ["nist-ssdf:PS.1.1", "soc2:CC8.1"]

  - ref: A.8.5
    title: Secure authentication
    requirement: >
      Secure authentication technologies and procedures are implemented based on access
      restrictions and the access control policy.
    category: authentication-access
    severity: high
    fixability: code
    guidance: >
      Check user authentication (strong password storage, brute-force protection, MFA for
      privileged and remote access, secure session handling), service authentication
      (workload identity or short-lived tokens instead of static keys), and absence of
      default credentials. See the OWASP ASVS V6 and V7 controls for detailed checks.
    evidence:
      - Strong password hashing, MFA and brute-force protection
      - No default or shared credentials
    checks: [weak-password-hash, default-credentials, missing-rate-limiting, jwt-unverified]
    crosswalk: ["owasp-asvs:V6.3.1", "owasp-asvs:V6.3.3", "owasp-asvs:V11.4.2", "soc2:CC6.1"]

  - ref: A.8.7
    title: Protection against malware
    requirement: >
      Protection against malware is implemented and supported by user awareness.
    category: vulnerability-management
    severity: medium
    fixability: code
    guidance: >
      For a product repository, look for scanning of user-uploaded files (ClamAV, cloud
      malware scanning for object storage), container image scanning in CI, endpoint
      protection policies for build agents, and controls against malicious dependencies
      (lockfiles, registry allowlists, install-script restrictions such as npm
      ignore-scripts in CI).
    evidence:
      - Malware scanning of uploads and images
      - Dependency integrity controls in CI
    artifacts: [vulnerability-scanning]
    crosswalk: ["owasp-asvs:V5.2.2"]

  - ref: A.8.8
    title: Management of technical vulnerabilities
    requirement: >
      Information about technical vulnerabilities is obtained in a timely way, exposure is
      evaluated and appropriate measures are taken.
    category: vulnerability-management
    severity: high
    fixability: code
    guidance: >
      Check for dependency and container scanning in CI (Dependabot, Renovate, Trivy,
      Grype, Snyk, osv-scanner, npm audit, pip-audit), SAST (CodeQL, Semgrep), defined
      remediation SLAs, a vulnerability disclosure policy (SECURITY.md, security.txt) and
      evidence that findings are fixed within SLA. Flag outdated base images and
      dependencies with known critical CVEs.
    evidence:
      - Automated scanning with remediation SLAs
      - Vulnerability disclosure policy
    checks: [unpinned-dependencies]
    artifacts: [vulnerability-scanning, dependency-update-automation, security-policy, sbom]
    crosswalk: ["soc2:CC7.1", "owasp-asvs:V15.2.1", "nis2:Art.21(2)(e)", "eu-cra:AnnexI.II.2"]

  - ref: A.8.9
    title: Configuration management
    requirement: >
      Security configurations of hardware, software, services and networks are
      established, documented, implemented, monitored and reviewed.
    category: secure-development
    severity: medium
    fixability: code
    guidance: >
      Check that infrastructure and runtime configuration is defined as code (Terraform,
      Pulumi, CloudFormation, Helm, Kubernetes manifests, Ansible) and reviewed, that
      hardening baselines are enforced by scanners (checkov, tfsec, kube-linter, kube-bench)
      in CI, and that production configuration disables debug features and runs containers
      as non-root with read-only file systems where possible. Detect drift between code and
      deployed state where tooling allows.
    evidence:
      - Infrastructure as code with hardening checks in CI
      - Production configuration without debug features
    checks: [debug-enabled, docker-root-user]
    artifacts: [static-analysis-config, ci-pipeline]
    crosswalk: ["soc2:CC7.1", "owasp-asvs:V13.4.2", "nist-ssdf:PO.5.1"]

  - ref: A.8.10
    title: Information deletion
    requirement: >
      Information in systems, devices and storage media is deleted when no longer required.
    category: data-protection
    severity: medium
    fixability: code
    when:
      { not: { fact: dataCategories, in: [none] } }
    guidance: >
      Look for retention rules implemented in code: scheduled deletion or anonymisation
      jobs, TTL indexes, S3 lifecycle rules, log retention settings, and account deletion
      that removes data from primary stores, caches, search indexes, analytics and backups
      within a documented period. Check that soft-deleted records are eventually purged.
    evidence:
      - Documented retention periods implemented by jobs or lifecycle rules
      - Account deletion covering all data stores
    crosswalk: ["gdpr:Art.17", "gdpr:Art.5(1)(e)", "soc2:C1.2"]

  - ref: A.8.11
    title: Data masking
    requirement: >
      Data masking is used according to the access control policy and business and legal
      requirements.
    category: data-protection
    severity: medium
    fixability: code
    when:
      { not: { fact: dataCategories, in: [none] } }
    guidance: >
      Check that sensitive fields are masked in user interfaces and API responses where
      full values are not needed (card numbers, national ids, phone numbers), redacted in
      logs and error reports (Sentry beforeSend scrubbing, logger redaction), and that
      non-production environments use masked or synthetic data rather than production
      copies.
    evidence:
      - Masking in UI, APIs and logs
      - Masked or synthetic data in test environments
    checks: [pii-in-logs]
    crosswalk: ["owasp-asvs:V16.2.5", "pci-dss:Req3.4.1", "owasp-llm-top10:LLM02"]

  - ref: A.8.12
    title: Data leakage prevention
    requirement: >
      Data leakage prevention measures are applied to systems, networks and devices that
      process, store or transmit sensitive information.
    category: data-protection
    severity: medium
    fixability: code
    guidance: >
      In a product context, check egress controls (restricted outbound network policies,
      allowlisted third-party endpoints), that sensitive data is not sent to analytics or
      error tracking, that object storage is private with signed URLs, that responses
      return only needed fields, and that secret scanning prevents credential leaks in
      code and CI logs.
    evidence:
      - Private storage with signed access and minimal API responses
      - Egress restrictions and secret scanning
    checks: [hardcoded-secret, analytics-tracking-sdk]
    crosswalk: ["owasp-asvs:V16.2.5", "owasp-masvs:MASVS-STORAGE-2", "soc2:C1.1"]

  - ref: A.8.13
    title: Information backup
    requirement: >
      Backup copies of information, software and systems are maintained and regularly
      tested according to an agreed backup policy.
    category: resilience-availability
    severity: high
    fixability: code
    guidance: >
      Check infrastructure as code for automated backups (RDS backup_retention_period,
      point-in-time recovery, Cloud SQL backups, volume snapshots, S3 versioning and
      replication), encryption and separation of backups (different account or immutable
      storage such as Object Lock), and a documented, tested restore procedure with RPO and
      RTO targets.
    evidence:
      - Automated, encrypted backups with defined retention
      - Restore test records against RPO and RTO
    artifacts: [backup-restore]
    crosswalk: ["soc2:A1.2", "nis2:Art.21(2)(c)", "dora:Art.12"]

  - ref: A.8.15
    title: Logging
    requirement: >
      Logs that record activities, exceptions, faults and other relevant events are
      produced, stored, protected and analysed.
    category: logging-monitoring
    severity: high
    fixability: code
    guidance: >
      Check that security-relevant events (authentication, authorisation failures, admin
      actions, data exports, configuration changes) are logged in structured form with
      timestamps and actor ids, shipped to a central store, protected from tampering and
      deletion, retained per policy, and free of secrets and unnecessary personal data.
      Check cloud audit logs (CloudTrail, Cloud Audit Logs, Azure Activity Log) are enabled
      in infrastructure as code.
    evidence:
      - Structured security event logging to a protected central store
      - Cloud audit logging enabled with retention
    checks: [pii-in-logs]
    crosswalk: ["owasp-asvs:V16.3.1", "soc2:CC7.2", "eu-ai-act:Art.12"]

  - ref: A.8.16
    title: Monitoring activities
    requirement: >
      Networks, systems and applications are monitored for anomalous behaviour and
      appropriate actions are taken to evaluate potential incidents.
    category: logging-monitoring
    severity: high
    fixability: code
    guidance: >
      Look for alerting rules on security signals (repeated login failures, privilege
      changes, unusual data exports, WAF blocks, error spikes), cloud threat detection
      (GuardDuty, Security Command Center, Defender for Cloud) enabled in infrastructure as
      code, uptime and health monitoring, and routing of alerts to on-call.
    evidence:
      - Security alerting rules routed to on-call
      - Cloud threat detection enabled
    crosswalk: ["soc2:CC7.2", "nis2:Art.21(2)(b)"]

  - ref: A.8.20
    title: Network security
    requirement: >
      Networks and network devices are secured, managed and controlled to protect
      information in systems and applications, including security of network services
      (A.8.21).
    category: communications-security
    severity: high
    fixability: code
    guidance: >
      Check infrastructure as code for security groups or firewall rules open to 0.0.0.0/0
      on administrative or database ports (22, 3389, 5432, 3306, 6379, 27017, 9200),
      databases with public endpoints, TLS on load balancers and internal connections,
      WAF in front of public web endpoints, and restricted egress. Check application TLS
      use and certificate verification.
    evidence:
      - No administrative or data ports exposed to the internet
      - TLS on all external and internal connections
    checks: [cleartext-transport, tls-verification-disabled]
    crosswalk: ["owasp-asvs:V12.3.2", "soc2:CC6.6", "nis2:Art.21(2)(h)"]

  - ref: A.8.22
    title: Segregation of networks
    requirement: >
      Groups of information services, users and systems are segregated in networks.
    category: communications-security
    severity: medium
    fixability: code
    guidance: >
      Check that production, staging and development run in separate accounts, projects or
      VPCs; that databases and internal services sit in private subnets; that Kubernetes
      NetworkPolicies or service mesh policies restrict east-west traffic; and that
      docker-compose files do not publish internal service ports to the host in production.
    evidence:
      - Separate network boundaries per environment and tier
      - Network policies restricting internal traffic
    crosswalk: ["soc2:CC6.6"]

  - ref: A.8.24
    title: Use of cryptography
    requirement: >
      Rules for the effective use of cryptography, including key management, are defined
      and implemented.
    category: cryptography
    severity: high
    fixability: code
    guidance: >
      Check encryption in transit (TLS 1.2 or newer) and at rest (storage and database
      encryption flags in infrastructure as code, KMS keys with rotation), approved
      algorithms in code (AES-GCM, SHA-256 or stronger, argon2 or bcrypt for passwords),
      CSPRNG for secrets, and key management through KMS or a vault rather than keys in the
      repository.
    evidence:
      - Encryption at rest and in transit configured
      - Approved algorithms and managed keys with rotation
    checks: [weak-cipher, weak-hash, hardcoded-crypto-key, insecure-random, weak-password-hash]
    crosswalk: ["owasp-asvs:V11.3.2", "owasp-asvs:V12.2.1", "soc2:CC6.7", "nis2:Art.21(2)(h)"]

  - ref: A.8.25
    title: Secure development life cycle
    requirement: >
      Rules for the secure development of software and systems are established and
      applied.
    category: secure-development
    severity: high
    fixability: process
    guidance: >
      Look for a documented secure development process (security requirements, threat
      modelling, secure coding standard, code review, security testing, release
      approval) and CI that enforces it: required reviews, SAST, dependency scanning,
      secret scanning and tests as merge gates.
    evidence:
      - Documented secure development process
      - CI gates matching the documented process
    artifacts: [coding-standard, code-review-process, ci-pipeline, static-analysis-config]
    crosswalk: ["nist-ssdf:PO.1.1", "soc2:CC8.1", "iec-62443-4-1:SM-1"]

  - ref: A.8.26
    title: Application security requirements
    requirement: >
      Information security requirements are identified, specified and approved when
      developing or acquiring applications.
    category: secure-development
    severity: medium
    fixability: document
    guidance: >
      Look for security requirements in design documents, issue templates or an adopted
      baseline such as OWASP ASVS at a stated level, covering authentication,
      authorisation, input handling, data protection, logging and, for payments or
      transactions, integrity and non-repudiation. Check that requirements trace to tests.
    evidence:
      - Security requirements baseline (for example ASVS level) referenced in design
    artifacts: [requirements-traceability, architecture-doc]
    crosswalk: ["nist-ssdf:PW.1.1", "iec-62443-4-1:SR-3"]

  - ref: A.8.27
    title: Secure system architecture and engineering principles
    requirement: >
      Principles for engineering secure systems are established, documented, maintained and
      applied to all development activities.
    category: secure-development
    severity: medium
    fixability: document
    guidance: >
      Look for architecture documentation describing trust boundaries, data flows,
      authentication between components, defence in depth, least privilege and secure
      defaults, and architecture decision records for security-relevant choices. Check that
      the implemented architecture matches (for example, internal services are not
      directly internet-facing).
    evidence:
      - Architecture document with trust boundaries and security principles
    artifacts: [architecture-doc, threat-model]
    crosswalk: ["nist-ssdf:PW.1.1"]

  - ref: A.8.28
    title: Secure coding
    requirement: >
      Secure coding principles are applied to software development.
    category: code-safety
    severity: high
    fixability: code
    guidance: >
      Check for an adopted secure coding standard, linters and SAST in CI (Semgrep, CodeQL,
      SonarQube, Bandit, gosec, ESLint security plugins) and absence of the common
      dangerous patterns: injection-prone query and command construction, unsafe
      deserialisation, eval, XSS sinks, path traversal, hardcoded secrets and leaked error
      details.
    evidence:
      - Secure coding standard and SAST in CI
      - No high-risk patterns flagged by detectors
    checks: [sql-injection-risk, command-injection-risk, dynamic-code-eval, unsafe-deserialization, xss-risk, path-traversal-risk, hardcoded-secret, error-details-leak]
    artifacts: [coding-standard, static-analysis-config]
    crosswalk: ["owasp-asvs:V1.2.4", "owasp-top10:A05", "nist-ssdf:PW.5.1"]

  - ref: A.8.29
    title: Security testing in development and acceptance
    requirement: >
      Security testing processes are defined and implemented in the development life
      cycle.
    category: testing-verification
    severity: high
    fixability: code
    guidance: >
      Look for automated security tests (authorisation tests for cross-user and
      cross-tenant access, input validation tests), DAST in CI or staging (OWASP ZAP,
      Burp, Nuclei), periodic penetration tests with tracked remediation, and acceptance
      criteria that include security checks before release.
    evidence:
      - Automated security tests and DAST
      - Penetration test reports with remediation tracking
    artifacts: [automated-tests, ci-pipeline, vulnerability-scanning]
    crosswalk: ["nist-ssdf:PW.8.2", "soc2:CC7.1", "iec-62443-4-1:SVV-3"]

  - ref: A.8.31
    title: Separation of development, test and production environments
    requirement: >
      Development, testing and production environments are separated and secured.
    category: secure-development
    severity: medium
    fixability: code
    guidance: >
      Check for separate cloud accounts or projects and credentials per environment,
      environment-specific configuration without shared secrets, no production data or
      credentials in development configuration, and deployment to production only through
      CI with approvals (GitHub environments with required reviewers, protected
      pipelines).
    evidence:
      - Separate accounts and secrets per environment
      - Production deployments only through approved pipelines
    checks: [hardcoded-secret]
    artifacts: [ci-pipeline]
    crosswalk: ["soc2:CC8.1", "pci-dss:Req6.5.1"]

  - ref: A.8.32
    title: Change management
    requirement: >
      Changes to information processing facilities and systems are subject to change
      management procedures.
    category: secure-development
    severity: high
    fixability: process
    guidance: >
      Check that all changes go through pull requests with review and passing checks,
      that infrastructure changes are applied by pipelines from reviewed code (terraform
      plan in PR, apply on merge), that releases are versioned with changelogs, that
      database migrations are versioned, and that emergency changes are documented
      afterwards.
    evidence:
      - Reviewed pull requests and CI checks for all changes
      - Versioned releases with changelogs and migrations
    artifacts: [code-review-process, ci-pipeline, changelog]
    crosswalk: ["soc2:CC8.1", "nist-ssdf:PS.1.1"]

  - ref: A.8.33
    title: Test information
    requirement: >
      Test information is appropriately selected, protected and managed.
    category: data-protection
    severity: medium
    fixability: code
    guidance: >
      Check fixtures, seed files, test databases and snapshots for real personal data,
      production dumps or real credentials. Compliant repositories use synthetic data
      generators (Faker), anonymised extracts with documented approval, and test-only
      credentials.
    evidence:
      - Synthetic or anonymised test data
      - No real credentials in test fixtures
    checks: [hardcoded-secret, default-credentials]
    crosswalk: ["gdpr:Art.25", "pci-dss:Req6.5.1"]
