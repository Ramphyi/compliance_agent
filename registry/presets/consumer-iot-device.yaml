  markets: [EU, UK]
  audience: [consumers]
  orgRole: manufacturer
  orgSize: medium
  dataCategories: [personal, location]
  aiUsage: none
  safetyCritical: "no"
  sil: none
  connectivity: [wifi, bluetooth, internet]
  updates: ota
  distribution: [preinstalled-hardware, web]
  regulatedEntity: [none]
  certificationsTarget: [cyber-trust-mark]
  openSource: proprietary
includeFrameworks: []
excludeFrameworks: []
verify:
  - make all
  - make test
