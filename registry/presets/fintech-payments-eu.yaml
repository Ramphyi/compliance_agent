id: fintech-payments-eu
title: Consumer fintech payments app (EU, PSD2)
description: >
  A consumer fintech app in the EU that takes card payments through a tokenised
  provider SDK (we never see the PAN) and acts as an ICT provider to banks.
  Brings PSD2 / strong customer authentication, DORA ICT risk and third-party
  duties, GDPR and financial-data protection, PCI DSS SAQ-A scope limited by the
  tokenised SDK, and the OWASP ASVS and mobile MASVS controls.
